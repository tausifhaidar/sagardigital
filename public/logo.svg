<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Sagar Digital</title>
  <desc id="desc">Sagar Digital logo with SD monogram</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a6"/>
      <stop offset="0.35" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#c88712"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="640" height="180" rx="28" fill="#050b14"/>
  <circle cx="92" cy="90" r="70" fill="#071522" stroke="#d7a832" stroke-width="3"/>
  <text x="92" y="107" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="url(#silver)" filter="url(#shadow)">S</text>
  <path d="M68 77 Q96 48 129 73 Q147 87 132 107 Q118 126 92 112 L113 101 Q123 106 130 96 Q136 84 121 80 Q103 75 89 89 Z" fill="url(#gold)"/>
  <circle cx="120" cy="67" r="9" fill="#0ea5e9" stroke="#fff" stroke-width="3"/>
  <circle cx="120" cy="67" r="3" fill="#f43f5e"/>
  <text x="180" y="88" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" letter-spacing="2" fill="url(#silver)">SAGAR</text>
  <text x="180" y="135" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" letter-spacing="3" fill="url(#gold)">DIGITAL</text>
  <rect x="180" y="146" width="350" height="3" rx="2" fill="#d7a832"/>
  <text x="538" y="133" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#e2e8f0">PRINT • DESIGN • DISPLAY</text>
